<!DOCTYPE html>
<html>
<head>
    <title>VSRCPlayer mediaId Test</title>
    <script src="../../dist/vsrc-player.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>VSRCPlayer mediaId Tests</h1>
    <div id="test-results"></div>
    <video id="test-player" class="video-js" style="display:none;"></video>

    <script>
        const results = [];

        function addResult(test, passed, message) {
            results.push({ test, passed, message });
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${passed ? '✓' : '✗'} ${test}: ${message}`;
            document.getElementById('test-results').appendChild(div);
        }

        // Test 1: mediaId is required
        try {
            const player = new VSRCPlayer('#test-player', {
                type: 'vod'
                // No mediaId
            });
            addResult('mediaId required', false, 'Should have thrown an error');
        } catch (e) {
            if (e.message.includes('mediaId is required')) {
                addResult('mediaId required', true, 'Correctly throws error when mediaId is missing');
            } else {
                addResult('mediaId required', false, `Wrong error message: ${e.message}`);
            }
        }

        // Test 2: Source URL is generated correctly
        try {
            const player = new VSRCPlayer('#test-player', {
                type: 'vod',
                mediaId: 'test-video-123'
            });
            
            const expectedSrc = '//api.vsrc.video/hls/resolve/test-video-123';
            if (player.options.src === expectedSrc) {
                addResult('Source URL generation', true, `Correctly generated: ${expectedSrc}`);
            } else {
                addResult('Source URL generation', false, `Expected ${expectedSrc}, got ${player.options.src}`);
            }

            // Test 3: AnalyticsReporter is created with mediaId
            if (player.analytics && player.analytics.mediaId === 'test-video-123') {
                addResult('Analytics mediaId', true, 'AnalyticsReporter has correct mediaId');
            } else {
                addResult('Analytics mediaId', false, 'AnalyticsReporter mediaId is incorrect');
            }

            // Test 4: userId should not exist
            if (player.analytics.userId === undefined) {
                addResult('userId removed', true, 'userId is not present in AnalyticsReporter');
            } else {
                addResult('userId removed', false, 'userId still exists in AnalyticsReporter');
            }

            // Cleanup
            player.dispose();
        } catch (e) {
            addResult('Player initialization', false, `Error: ${e.message}`);
        }

        // Test 5: Different mediaId generates different URL
        try {
            const player2 = new VSRCPlayer('#test-player', {
                type: 'live',
                mediaId: 'live-stream-789'
            });
            
            const expectedSrc2 = '//api.vsrc.video/hls/resolve/live-stream-789';
            if (player2.options.src === expectedSrc2) {
                addResult('Different mediaId', true, `Correctly generated: ${expectedSrc2}`);
            } else {
                addResult('Different mediaId', false, `Expected ${expectedSrc2}, got ${player2.options.src}`);
            }

            player2.dispose();
        } catch (e) {
            addResult('Different mediaId', false, `Error: ${e.message}`);
        }

        // Summary
        const totalTests = results.length;
        const passedTests = results.filter(r => r.passed).length;
        const summary = document.createElement('div');
        summary.className = `test-result ${passedTests === totalTests ? 'pass' : 'fail'}`;
        summary.innerHTML = `<strong>Summary: ${passedTests}/${totalTests} tests passed</strong>`;
        document.getElementById('test-results').appendChild(summary);
    </script>
</body>
</html>
