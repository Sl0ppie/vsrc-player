<!DOCTYPE html>
<html>
<head>
    <title>VSRCPlayer JSON Resolution Test</title>
    <script src="../dist/vsrc-player.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>VSRCPlayer JSON Resolution Tests</h1>
    <p>This test verifies that the player correctly handles URL resolution with JSON responses containing the 'ul' key.</p>
    <div id="test-results"></div>
    <video id="test-player" class="video-js" style="display:none;"></video>

    <script>
        const results = [];

        function addResult(test, passed, message) {
            results.push({ test, passed, message });
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${passed ? '✓' : '✗'} ${test}: ${message}`;
            document.getElementById('test-results').appendChild(div);
        }

        function addInfo(message) {
            const div = document.createElement('div');
            div.className = 'test-result info';
            div.textContent = `ℹ ${message}`;
            document.getElementById('test-results').appendChild(div);
        }

        // Test 1: _resolveUrl method exists
        addInfo('Testing URL resolution functionality...');
        
        try {
            const player = new VSRCPlayer('#test-player', {
                type: 'vod',
                mediaId: 'test-video-123',
                onReady: (p) => {
                    // Test 2: Check if _resolveUrl method exists
                    if (typeof p._resolveUrl === 'function') {
                        addResult('_resolveUrl method', true, 'Method exists on player instance');
                    } else {
                        addResult('_resolveUrl method', false, 'Method does not exist on player instance');
                    }

                    // Test 3: Check if resolvedSrc property exists
                    if ('resolvedSrc' in p) {
                        addResult('resolvedSrc property', true, 'Property exists on player instance');
                        
                        // Log the resolved URL
                        addInfo(`Resolved URL: ${p.resolvedSrc || 'Not yet resolved'}`);
                    } else {
                        addResult('resolvedSrc property', false, 'Property does not exist on player instance');
                    }

                    // Test 4: Original src should be the resolve endpoint
                    const expectedSrc = '//api.vsrc.video/hls/resolve/test-video-123';
                    if (p.options.src === expectedSrc) {
                        addResult('Original src', true, `Correctly set to: ${expectedSrc}`);
                    } else {
                        addResult('Original src', false, `Expected ${expectedSrc}, got ${p.options.src}`);
                    }

                    // Test 5: Test _resolveUrl directly with a mock JSON endpoint
                    addInfo('Testing _resolveUrl with a JSON endpoint...');
                    // Note: This test will fail with httpbin.org/json because it doesn't have a 'ul' key
                    // In real usage, the API at api.vsrc.video/hls/resolve/{mediaId} would return {ul: "video_url"}
                    const testUrl = 'https://httpbin.org/json';
                    
                    p._resolveUrl(testUrl).then(resolvedUrl => {
                        if (resolvedUrl) {
                            addResult('_resolveUrl resolution', true, `Successfully resolved to: ${resolvedUrl}`);
                            addInfo('Note: httpbin.org/json does not have a "ul" key, so it returns the original URL as fallback');
                        } else {
                            addResult('_resolveUrl resolution', false, 'Resolved URL is empty');
                        }
                        
                        // Cleanup and show summary
                        p.dispose();
                        showSummary();
                    }).catch(error => {
                        addResult('_resolveUrl resolution', false, `Error: ${error.message}`);
                        p.dispose();
                        showSummary();
                    });
                },
                onError: (error) => {
                    addInfo(`Player error (expected for test URL): ${error.message}`);
                }
            });
            
            addResult('Player initialization', true, 'Player created successfully');
        } catch (e) {
            addResult('Player initialization', false, `Error: ${e.message}`);
            showSummary();
        }

        // Summary
        function showSummary() {
            const totalTests = results.length;
            const passedTests = results.filter(r => r.passed).length;
            const summary = document.createElement('div');
            summary.className = `test-result ${passedTests === totalTests ? 'pass' : 'fail'}`;
            summary.innerHTML = `<strong>Summary: ${passedTests}/${totalTests} tests passed</strong>`;
            document.getElementById('test-results').appendChild(summary);
        }
    </script>
</body>
</html>
