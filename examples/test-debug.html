<!DOCTYPE html>
<html>
<head>
    <title>VSRCPlayer Debug Option Test</title>
    <script src="../dist/vsrc-player.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>VSRCPlayer Debug Option Tests</h1>
    <div id="test-results"></div>
    <video id="test-player-1" class="video-js" style="display:none;"></video>
    <video id="test-player-2" class="video-js" style="display:none;"></video>

    <script>
        const results = [];

        function addResult(test, passed, message) {
            results.push({ test, passed, message });
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${passed ? '✓' : '✗'} ${test}: ${message}`;
            document.getElementById('test-results').appendChild(div);
        }

        function addInfo(message) {
            const div = document.createElement('div');
            div.className = 'test-result info';
            div.textContent = `ℹ ${message}`;
            document.getElementById('test-results').appendChild(div);
        }

        // Test 1: Default behavior (no debug parameter)
        try {
            const player1 = new VSRCPlayer('#test-player-1', {
                type: 'vod',
                mediaId: 'test-video-123',
                onReady: (p) => {
                    // Test analytics URLs
                    if (p.analytics.wsUrl === 'wss://api.vsrc.video/ws/analytics') {
                        addResult('Default WS URL', true, 'WebSocket URL uses default api.vsrc.video');
                    } else {
                        addResult('Default WS URL', false, `Expected wss://api.vsrc.video/ws/analytics, got ${p.analytics.wsUrl}`);
                    }

                    if (p.analytics.ajaxUrl === 'https://api.vsrc.video/api/analytics/event') {
                        addResult('Default AJAX URL', true, 'AJAX URL uses default api.vsrc.video');
                    } else {
                        addResult('Default AJAX URL', false, `Expected https://api.vsrc.video/api/analytics/event, got ${p.analytics.ajaxUrl}`);
                    }

                    p.dispose();
                    runTest2();
                }
            });

            const expectedSrc1 = '//api.vsrc.video/hls/resolve/test-video-123';
            if (player1.options.src === expectedSrc1) {
                addResult('Default source URL', true, `Correctly uses default: ${expectedSrc1}`);
            } else {
                addResult('Default source URL', false, `Expected ${expectedSrc1}, got ${player1.options.src}`);
            }
        } catch (e) {
            addResult('Default player initialization', false, `Error: ${e.message}`);
            runTest2();
        }

        // Test 2: With debug parameter
        function runTest2() {
            addInfo('Testing with debug parameter set to "localhost:3000"');
            
            try {
                const player2 = new VSRCPlayer('#test-player-2', {
                    type: 'live',
                    mediaId: 'live-stream-789',
                    debug: 'localhost:3000',
                    onReady: (p) => {
                        // Test analytics URLs with debug host
                        if (p.analytics.wsUrl === 'wss://localhost:3000/ws/analytics') {
                            addResult('Debug WS URL', true, 'WebSocket URL uses debug host');
                        } else {
                            addResult('Debug WS URL', false, `Expected wss://localhost:3000/ws/analytics, got ${p.analytics.wsUrl}`);
                        }

                        if (p.analytics.ajaxUrl === 'https://localhost:3000/api/analytics/event') {
                            addResult('Debug AJAX URL', true, 'AJAX URL uses debug host');
                        } else {
                            addResult('Debug AJAX URL', false, `Expected https://localhost:3000/api/analytics/event, got ${p.analytics.ajaxUrl}`);
                        }

                        // Verify debug option is stored
                        if (p.options.debug === 'localhost:3000') {
                            addResult('Debug option stored', true, 'Debug option correctly stored in player options');
                        } else {
                            addResult('Debug option stored', false, `Expected localhost:3000, got ${p.options.debug}`);
                        }

                        p.dispose();
                        showSummary();
                    }
                });

                const expectedSrc2 = '//localhost:3000/hls/resolve/live-stream-789';
                if (player2.options.src === expectedSrc2) {
                    addResult('Debug source URL', true, `Correctly uses debug host: ${expectedSrc2}`);
                } else {
                    addResult('Debug source URL', false, `Expected ${expectedSrc2}, got ${player2.options.src}`);
                }
            } catch (e) {
                addResult('Debug player initialization', false, `Error: ${e.message}`);
                showSummary();
            }
        }

        // Summary
        function showSummary() {
            const totalTests = results.length;
            const passedTests = results.filter(r => r.passed).length;
            const summary = document.createElement('div');
            summary.className = `test-result ${passedTests === totalTests ? 'pass' : 'fail'}`;
            summary.innerHTML = `<strong>Summary: ${passedTests}/${totalTests} tests passed</strong>`;
            document.getElementById('test-results').appendChild(summary);
        }
    </script>
</body>
</html>
